plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'fr.terrelfe.cockpit'
    compileSdk 35
    buildToolsVersion '35.0.0'
    signingConfigs {
        debug {
            storeFile rootProject.file('.local/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    defaultConfig {
        applicationId 'fr.terrelfe.cockpit'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/cockpit/assets"
        }
    }
}
chaquopy {
    sourceSets {
        main { srcDir "$buildDir/generated/cockpit/python" }
    }
    defaultConfig {
        version '3.12'
        pip { install 'tzdata==2025.2'; install 'openpyxl==3.1.5' }
    }
}
tasks.register('prepareCockpit', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_assets.py'
    inputs.files(fileTree('../') { include '*.js', '*.css', '*.html', '*.png', '*.svg', '*.ico', '*_core.py', 'linky_server.py', 'build_*.py', 'energy.db', 'KWH.xlsx' })
    outputs.dir "$buildDir/generated/cockpit"
}
tasks.named('preBuild').configure { dependsOn 'prepareCockpit' }
tasks.configureEach { if (name.contains('Python')) dependsOn 'prepareCockpit' }
tasks.register('prepareDebugKey', Exec) {
    def keyFile = rootProject.file('.local/debug.keystore')
    onlyIf { !keyFile.exists() }
    doFirst { keyFile.parentFile.mkdirs() }
    commandLine "${System.getProperty('java.home')}/bin/keytool", '-genkeypair', '-noprompt',
        '-keystore', keyFile, '-storepass', 'android', '-keypass', 'android',
        '-alias', 'androiddebugkey', '-dname', 'CN=Android Debug,O=Android,C=FR',
        '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000'
}
tasks.configureEach { if (name == 'validateSigningDebug') dependsOn 'prepareDebugKey' }
