pluginManagement {
    repositories {
        google()
        // Official Google mirror avoids Maven Central's shared-IP rate limits.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2' }
        mavenCentral()
    }
}
rootProject.name = 'CockpitSolaire'
include ':app'
