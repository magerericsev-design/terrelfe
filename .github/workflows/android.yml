name: APK Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Installer les outils Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tester le moteur embarqué
        run: |
          python -m pip install openpyxl==3.1.5 tzdata==2025.2
          python android/tools/prepare_assets.py
          python android/tests/test_backend.py
      - name: Compiler l’APK de test
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cockpit-Solaire-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
